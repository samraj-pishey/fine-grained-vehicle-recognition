[project]
name = "vehicle-recognition"
version = "1.0.0"
description = "Intelligent Fine-Grained Vehicle Recognition and Analysis System (Stanford Cars, 196 classes)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
# Runtime dependencies: everything the deployed Streamlit app needs (CPU inference only).
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "onnxruntime>=1.18",
    "streamlit>=1.36",
    "plotly>=5.20",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "psutil>=5.9",
    "scipy>=1.12",
]

[project.optional-dependencies]
# Research / training / export / evaluation (not installed in the production image).
research = [
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.4",
    "onnx>=1.16",
    "onnxslim>=0.1.30",
    "pyarrow>=15",
    "imagehash>=4.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_recognition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
markers = [
    "data: requires the local Stanford Cars dataset (DATA_ROOT)",
    "models: requires trained model artefacts",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
